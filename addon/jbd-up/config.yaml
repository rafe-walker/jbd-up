name: jbd-up
version: "0.1.0"
slug: jbd_up
description: Read JBD UP16S-series BMS (Eco-Worthy 48 V rack batteries) over RS485/RS232 and publish to MQTT with Home Assistant discovery
url: https://github.com/rafe-walker/jbd-up
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
uart: true
usb: true
udev: true
hassio_api: false
homeassistant_api: false
services:
  - mqtt:want
map: []
options:
  port: /dev/ttyUSB0
  baud: 9600
  addresses: "1"
  dialect: auto
  interval: 5
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  base_topic: jbd_up
  ha_prefix: homeassistant
  high_res_soc: true
  log_level: info
schema:
  port: device(subsystem=tty)
  baud: list(9600|19200|38400|115200)
  addresses: str
  dialect: list(auto|up|pylontech)
  interval: int(1,600)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  base_topic: str
  ha_prefix: str
  high_res_soc: bool
  log_level: list(debug|info|warning|error)
image: ghcr.io/rafe-walker/jbd-up-addon-{arch}
