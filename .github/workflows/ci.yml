name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: ruff check . && ruff format --check .
      - run: pytest -q
  addon-image:
    # Builds the HA add-on image with the REPO ROOT as context so the add-on reuses src/jbd_up.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: base
        run: echo "image=$(python3 -c "import yaml;print(yaml.safe_load(open('addon/jbd-up/build.yaml'))['build_from']['${{ matrix.arch }}'])")" >> "$GITHUB_OUTPUT"
      - id: ver
        run: echo "version=$(python3 -c "import yaml;print(yaml.safe_load(open('addon/jbd-up/config.yaml'))['version'])")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/jbd-up/Dockerfile
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || matrix.arch == 'armv7' && 'linux/arm/v7' || 'linux/amd64' }}
          build-args: BUILD_FROM=${{ steps.base.outputs.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jbd-up-addon-${{ matrix.arch }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/jbd-up-addon-${{ matrix.arch }}:latest
